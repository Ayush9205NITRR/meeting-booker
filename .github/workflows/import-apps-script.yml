# ONE-TIME (or whenever someone has edited in the Apps Script editor).
#
# Pulls every file out of the live Apps Script project and commits it into
# apps-script/. After this runs, the repo holds Code.gs, index.html,
# appsscript.json — everything — and git becomes the source of truth.
#
# Nobody has to paste anything anywhere. Run it once, and from then on the
# only way code changes is a commit.

name: Import from Apps Script

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::error::Set the CLASPRC_JSON and APPS_SCRIPT_ID secrets first — see .github/workflows/README.md."
            exit 1
          fi

      # Writes ~/.clasprc.json from the secret.
      #
      # It takes everything from the first "{" to the last "}", because the
      # obvious way to get this value is to copy a terminal window — and
      # `clasp login` prints "You are logged in as ..." above the file, while
      # some shells print a trailing "%". Neither is JSON, and clasp's own
      # error for that ("Could not read API credentials") points at the
      # token rather than at the stray line. Trimming here costs nothing and
      # removes the single most likely way this step fails.
      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node -e '
            const raw = process.env.CLASPRC_JSON || "";
            const start = raw.indexOf("{");
            const end = raw.lastIndexOf("}");
            if (start < 0 || end < start) {
              // Describe the shape, never the content: enough to tell a
              // swapped secret from a half-copied one without printing
              // anything sensitive into a log.
              const looksLikeScriptId = /^[A-Za-z0-9_-]{20,}$/.test(raw.trim());
              const hint = looksLikeScriptId
                ? "It looks like a bare id — the Script ID may have gone into CLASPRC_JSON by mistake. Check that each of the three secrets has the right value."
                : raw.includes("logged in as")
                  ? "It looks like just the `clasp login` banner. That line is printed by the command; the file itself is what `cat ~/.clasprc.json` shows."
                  : "Run `cat ~/.clasprc.json` and copy everything it prints.";
              console.log("::error::CLASPRC_JSON contains no JSON object (" + raw.trim().length + " characters, no `{`). " + hint);
              process.exit(1);
            }
            const text = raw.slice(start, end + 1);

            let c;
            try { c = JSON.parse(text); }
            catch (e) { console.log("::error::CLASPRC_JSON is not valid JSON: " + e.message); process.exit(1); }

            if (c.token && c.token.refresh_token) {
              console.log("::error::That is a clasp 2 credential file. Run `npm install -g @google/clasp@3.4.1`, then `clasp login --no-localhost` again, and replace the CLASPRC_JSON secret.");
              process.exit(1);
            }
            if (!(c.tokens && c.tokens.default && c.tokens.default.refresh_token)) {
              console.log("::error::CLASPRC_JSON has no refresh_token in it. Re-run `clasp login --no-localhost` and copy all of ~/.clasprc.json.");
              process.exit(1);
            }

            require("fs").writeFileSync(require("os").homedir() + "/.clasprc.json", text);
            if (text.length !== raw.length) {
              console.log("::notice::Trimmed " + (raw.length - text.length) + " characters of non-JSON text around the credential.");
            }
            console.log("Credentials written.");
          '

      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Pull the live project
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          mkdir -p pulled
          printf '{"scriptId":"%s","rootDir":".","scriptExtensions":["gs","js"]}\n' "$SCRIPT_ID" > pulled/.clasp.json
          cd pulled && clasp pull
          rm -f .clasp.json
          echo "--- pulled ---"
          ls -1

      # The repo's own Overlay.gs / Kylas.gs are newer than whatever is
      # live (they may not even be pasted in yet), so the live copies of
      # those two are discarded and everything else is taken.
      - name: Merge into apps-script/
        run: |
          mkdir -p apps-script
          rm -f pulled/Overlay.gs pulled/Kylas.gs
          cp -a pulled/. apps-script/
          rm -rf pulled
          echo "--- apps-script/ now holds ---"
          ls -1 apps-script

      - name: Sanity check
        run: |
          [ -f apps-script/Code.gs ] || [ -f apps-script/Code.js ] \
            || { echo "::error::No Code.gs/Code.js came back — is APPS_SCRIPT_ID the right project?"; exit 1; }
          npm run check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script
          if git diff --cached --quiet; then
            echo "::notice::Already in sync — nothing to commit."
          else
            git commit -m "Import Apps Script project into the repo" \
              -m "Pulled from the live project so git is the source of truth. From here on, code changes happen as commits and Deploy Apps Script ships them."
            git push
          fi
