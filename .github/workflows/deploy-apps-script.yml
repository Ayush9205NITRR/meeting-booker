# Ships apps-script/ to the live Apps Script web app.
#
# The repo is the source of truth. Push a change to apps-script/ and it is
# live within a couple of minutes — nobody opens the Apps Script editor,
# nobody pastes anything, and every change has a commit behind it.
#
# Run "Import from Apps Script" once before enabling this, so the repo
# holds the whole project. Until then apps-script/ is missing Code.gs and
# index.html, and the guard below refuses to push rather than deleting them
# from the live project.

name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
      - ".github/workflows/deploy-apps-script.yml"
  workflow_dispatch:
    inputs:
      code_only:
        description: "Push the code but don't update the live deployment"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run checks
        run: npm run check

      - name: Check secrets
        id: secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::warning::CLASPRC_JSON / APPS_SCRIPT_ID not set — skipping. See .github/workflows/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # `clasp push --force` makes the live project match this folder
      # EXACTLY: anything in the project that isn't here gets deleted. That
      # is what makes the repo authoritative, and also what makes this the
      # one step worth guarding. If the import hasn't run, Code.gs and
      # index.html are missing and pushing would delete the booking engine
      # and the whole POC Router page.
      - name: Refuse to push an incomplete project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          missing=""
          [ -f apps-script/Code.gs ] || [ -f apps-script/Code.js ] || missing="$missing Code.gs"
          ls apps-script/*.html >/dev/null 2>&1 || missing="$missing (any .html)"
          if [ -n "$missing" ]; then
            echo "::error::apps-script/ is missing:$missing — pushing would DELETE them from the live project. Run the 'Import from Apps Script' workflow first."
            exit 1
          fi
          echo "Project looks complete:"
          ls -1 apps-script

      # Writes ~/.clasprc.json from the secret.
      #
      # It takes everything from the first "{" to the last "}", because the
      # obvious way to get this value is to copy a terminal window — and
      # `clasp login` prints "You are logged in as ..." above the file, while
      # some shells print a trailing "%". Neither is JSON, and clasp's own
      # error for that ("Could not read API credentials") points at the
      # token rather than at the stray line. Trimming here costs nothing and
      # removes the single most likely way this step fails.
      - name: Write clasp credentials
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node -e '
            const raw = process.env.CLASPRC_JSON || "";
            const start = raw.indexOf("{");
            const end = raw.lastIndexOf("}");
            if (start < 0 || end < start) {
              // Describe the shape, never the content: enough to tell a
              // swapped secret from a half-copied one without printing
              // anything sensitive into a log.
              const looksLikeScriptId = /^[A-Za-z0-9_-]{20,}$/.test(raw.trim());
              const hint = looksLikeScriptId
                ? "It looks like a bare id — the Script ID may have gone into CLASPRC_JSON by mistake. Check that each of the three secrets has the right value."
                : raw.includes("logged in as")
                  ? "It looks like just the `clasp login` banner. That line is printed by the command; the file itself is what `cat ~/.clasprc.json` shows."
                  : "Run `cat ~/.clasprc.json` and copy everything it prints.";
              console.log("::error::CLASPRC_JSON contains no JSON object (" + raw.trim().length + " characters, no `{`). " + hint);
              process.exit(1);
            }
            const text = raw.slice(start, end + 1);

            let c;
            try { c = JSON.parse(text); }
            catch (e) { console.log("::error::CLASPRC_JSON is not valid JSON: " + e.message); process.exit(1); }

            if (c.token && c.token.refresh_token) {
              console.log("::error::That is a clasp 2 credential file. Run `npm install -g @google/clasp@3.4.1`, then `clasp login --no-localhost` again, and replace the CLASPRC_JSON secret.");
              process.exit(1);
            }
            if (!(c.tokens && c.tokens.default && c.tokens.default.refresh_token)) {
              console.log("::error::CLASPRC_JSON has no refresh_token in it. Re-run `clasp login --no-localhost` and copy all of ~/.clasprc.json.");
              process.exit(1);
            }

            require("fs").writeFileSync(require("os").homedir() + "/.clasprc.json", text);
            if (text.length !== raw.length) {
              console.log("::notice::Trimmed " + (raw.length - text.length) + " characters of non-JSON text around the credential.");
            }
            console.log("Credentials written.");
          '

      # Writes apps-script/Secrets.gs from GitHub Secrets so the keys live in
      # one place instead of being typed into the Apps Script editor by hand.
      # The file is generated per run and never committed: .gitignore blocks
      # it locally, and the import workflow deletes it out of anything it
      # pulls, so the key cannot reach the repo from either direction.
      #
      # Skipped when no key is set, which leaves Script Properties in charge
      # — that is what overlaySecret_ falls back to.
      - name: Write Secrets.gs
        if: steps.secrets.outputs.ready == 'true'
        env:
          KYLAS_API_KEY: ${{ secrets.KYLAS_API_KEY }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          OVERLAY_TOKEN: ${{ secrets.OVERLAY_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const names = ["KYLAS_API_KEY", "AIRTABLE_PAT", "OVERLAY_TOKEN"];
            const set = names.filter((n) => process.env[n]);

            if (!set.length) {
              console.log("::notice::No key secrets set — the Apps Script project keeps using its own Script Properties.");
              process.exit(0);
            }

            const body = set.map((n) => "  " + n + ": " + JSON.stringify(process.env[n])).join(",\n");
            fs.writeFileSync("apps-script/Secrets.gs",
              "// GENERATED BY .github/workflows/deploy-apps-script.yml — do not edit,\n" +
              "// do not commit. Values come from this repository\u2019s GitHub Secrets.\n" +
              "// Rotating a key means updating the secret and re-running the deploy.\n" +
              "var OVERLAY_BUILD_SECRETS = {\n" + body + "\n};\n");

            console.log("Secrets.gs written with: " + set.join(", "));
          '

      - name: Install clasp
        if: steps.secrets.outputs.ready == 'true'
        run: npm install -g @google/clasp@3.4.1

      - name: Push
        if: steps.secrets.outputs.ready == 'true'
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          cd apps-script
          printf '{"scriptId":"%s","rootDir":".","scriptExtensions":["gs","js"]}\n' "$SCRIPT_ID" > .clasp.json
          clasp push --force
          rm -f .clasp.json

      # Updates the EXISTING deployment, so the /exec URL already pasted
      # into every BD's extension popup keeps working. A bare `clasp deploy`
      # mints a new URL nobody is pointing at.
      - name: Update the live deployment
        if: steps.secrets.outputs.ready == 'true' && !inputs.code_only
        env:
          SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::error::APPS_SCRIPT_DEPLOYMENT_ID not set — the code is pushed, but the live web app still runs the previous version."
            exit 1
          fi
          cd apps-script
          printf '{"scriptId":"%s","rootDir":".","scriptExtensions":["gs","js"]}\n' "$SCRIPT_ID" > .clasp.json
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub ${{ github.sha }}"
          rm -f .clasp.json
          echo "::notice::Live. The /exec URL is unchanged."
