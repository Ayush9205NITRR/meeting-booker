name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # tools/check.js parses every Apps Script and extension file, and
      # enforces the three Kylas owner-safety rules that each exist because
      # of a bug that already shipped. It has no dependencies, so there is
      # nothing to install.
      - name: Run checks
        run: npm run check

      # config/overlay-config.json is edited by non-developers straight on
      # github.com. Catching a broken edit here is the difference between a
      # red tick on the commit and every BD's overlay quietly falling back
      # to the bundled defaults.
      - name: Validate overlay config
        run: npm run check:config
