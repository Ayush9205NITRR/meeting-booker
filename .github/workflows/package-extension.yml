name: Package extension

on:
  workflow_dispatch:
    inputs:
      bundle_secrets:
        description: "Bake AIRTABLE_PAT / BACKEND_URL into the zip (build artifact only, never a release)"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run checks
        run: npm run check

      # Optional and off by default. A bundled PAT sits in every BD's
      # browser and can be read out of the extension folder, so the
      # supported path is still a read-only token pushed by Chrome policy
      # (managed_schema.json) or typed into the popup. This exists for the
      # small-team case where handing out one pre-configured folder beats
      # setting up the admin console.
      - name: Bundle secrets
        if: inputs.bundle_secrets
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$AIRTABLE_PAT" ]; then
            echo "::error::bundle_secrets was requested but the AIRTABLE_PAT secret is not set."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const q = (s) => JSON.stringify(s || "");
            fs.writeFileSync("extension/config/secrets.js",
              "// Generated by .github/workflows/package-extension.yml. Do not commit.\n" +
              "self.KylasOverlaySecrets = {\n" +
              "  airtablePat: " + q(process.env.AIRTABLE_PAT) + ",\n" +
              "  backendUrl: " + q(process.env.BACKEND_URL) + ",\n" +
              "  configUrl: \"\",\n" +
              "};\n");
          '
          echo "::notice::Secrets bundled. This zip is an artifact only and must not be published."

      - name: Build zip
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd extension && zip -r "../kylas-overlay-$VERSION.zip" . -x '*.DS_Store'

      - uses: actions/upload-artifact@v4
        with:
          name: kylas-overlay-${{ env.VERSION }}
          path: kylas-overlay-${{ env.VERSION }}.zip
          retention-days: 30

      # Tag builds only, and never one carrying a token: a release asset on
      # a public repo is world-readable.
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v') && !inputs.bundle_secrets
        uses: softprops/action-gh-release@v2
        with:
          files: kylas-overlay-${{ env.VERSION }}.zip
          body: |
            Unzip, then in Chrome: `chrome://extensions` → Developer mode →
            **Load unpacked** → pick the unzipped folder.

            The overlay reads its layout and queue buckets from
            `config/overlay-config.json` on `main`, so this build keeps
            following config changes without being reinstalled.
