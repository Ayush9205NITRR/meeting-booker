# Publishes the extension so that pushing to main puts the change on every
# BD's browser, with nobody reinstalling anything.
#
# Two outputs, and you pick which one you use:
#
#   dist/kylas-overlay.crx + updates.xml   auto-update. Chrome checks the
#     (GitHub Pages)                        update URL every few hours and
#                                           installs the new version by
#                                           itself. Needs the extension
#                                           force-installed once from the
#                                           Google Admin console, and a
#                                           CRX_PRIVATE_KEY secret.
#
#   kylas-overlay-<version>.zip            manual. Someone unzips and does
#     (build artifact / Release)            Load unpacked. Always produced,
#                                           needs no secrets — this is the
#                                           fallback and how you install
#                                           the very first time.
#
# The version is set to <major>.<minor>.<run number> at build time, so it
# always goes up and Chrome always sees an update. Nobody has to remember
# to bump manifest.json.

name: Release extension

on:
  push:
    branches: [main]
    paths:
      - "extension/**"
      - ".github/workflows/release-extension.yml"
      # The signing step runs this, so a change to it changes what ships.
      - "tools/crx-id.js"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-extension
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run checks
        run: npm run check

      - name: Set version
        id: version
        run: |
          BASE=$(node -p "require('./extension/manifest.json').version.split('.').slice(0,2).join('.')")
          VERSION="$BASE.${{ github.run_number }}"
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            m.version = process.argv[1];
            fs.writeFileSync("extension/manifest.json", JSON.stringify(m, null, 2) + "\n");
          ' "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Building $VERSION"

      # Always built, needs nothing. This is what you hand someone for a
      # first install, and the fallback if the signed path isn't set up.
      - name: Build zip
        run: cd extension && zip -qr "../kylas-overlay-${{ steps.version.outputs.version }}.zip" . -x '*.DS_Store'

      - uses: actions/upload-artifact@v4
        with:
          name: kylas-overlay-${{ steps.version.outputs.version }}-zip
          path: kylas-overlay-${{ steps.version.outputs.version }}.zip
          retention-days: 90

      # ---- configured build, for the load-unpacked pilot ----
      #
      # The same extension with config/secrets.js already filled in, so a BD
      # unzips it, loads it, and books a meeting without pasting anything.
      # That file holds the POC Router URL *including its ?token=* and the
      # Airtable PAT, so this zip is itself a credential and is handled as
      # one:
      #
      #   - Actions artifact only. It never reaches dist/, which goes to
      #     GitHub Pages with no login in front of it.
      #   - secrets.js is removed immediately after, BEFORE the signing and
      #     Pages steps rebuild the zip and the CRX out of extension/.
      #   - the publish job re-checks that nothing carrying it got out.
      #
      # Hand this to BDs through the domain-restricted Drive folder, never
      # through a link anyone can open.
      - name: Build the configured zip
        id: configured
        env:
          OVERLAY_BACKEND_URL: ${{ secrets.OVERLAY_BACKEND_URL }}
          OVERLAY_AIRTABLE_PAT: ${{ secrets.OVERLAY_AIRTABLE_PAT }}
        run: |
          if [ -z "$OVERLAY_BACKEND_URL" ] && [ -z "$OVERLAY_AIRTABLE_PAT" ]; then
            echo "::notice::Neither OVERLAY_BACKEND_URL nor OVERLAY_AIRTABLE_PAT is set — no configured zip, so BDs would have to fill the popup in by hand."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The web app is deployed ANYONE_ANONYMOUS and the token is the
          # only thing gating it, so a URL without one is refused on every
          # call and the BD sees "rejected the token" with nothing to act
          # on. Failing the build beats shipping that.
          case "$OVERLAY_BACKEND_URL" in
            "") : ;;
            *"?token="*|*"&token="*) : ;;
            *)
              echo "::error::OVERLAY_BACKEND_URL has no token on it. Put the whole /exec?token=... URL in the secret."
              exit 1 ;;
          esac

          node -e '
            const fs = require("fs");
            const q = (v) => JSON.stringify(String(v || ""));
            fs.writeFileSync("extension/config/secrets.js",
              "// GENERATED BY .github/workflows/release-extension.yml — do not edit,\n" +
              "// do not commit, and do not publish the zip that carries it.\n" +
              "// Rotating either value means updating the repo secret and\n" +
              "// re-running this workflow.\n" +
              "self.KylasOverlaySecrets = {\n" +
              "  airtablePat: " + q(process.env.OVERLAY_AIRTABLE_PAT) + ",\n" +
              "  backendUrl: " + q(process.env.OVERLAY_BACKEND_URL) + ",\n" +
              "  configUrl: \"\",\n" +
              "};\n");
          '

          cd extension
          zip -qr "../kylas-overlay-configured-${{ steps.version.outputs.version }}.zip" . -x '*.DS_Store'
          cd ..

          # Out of the tree before anything else builds from it. The signing
          # step and the Pages step both re-zip extension/, and neither
          # should ever see this file.
          rm -f extension/config/secrets.js

          echo "built=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Configured zip built. Put it in the Drive folder — do not publish it."

      - uses: actions/upload-artifact@v4
        if: steps.configured.outputs.built == 'true'
        with:
          name: kylas-overlay-configured-${{ steps.version.outputs.version }}
          path: kylas-overlay-configured-${{ steps.version.outputs.version }}.zip
          retention-days: 30

      # ---- signed build, for auto-update ----
      - name: Sign
        id: sign
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::warning::CRX_PRIVATE_KEY not set — zip only, no auto-update. See .github/workflows/README.md."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s' "$CRX_PRIVATE_KEY" > key.pem

          # A PEM pasted into a GitHub secret can arrive with its line
          # breaks stripped. The key is fine — OpenSSL just won't decode
          # it, and Chrome won't pack with it. Normalise the file once,
          # here, so both this and --pack-extension below read it.
          node tools/crx-id.js key.pem --fix-key > /dev/null

          EXT_ID=$(node tools/crx-id.js key.pem)
          # GitHub Pages hosts are lowercase; the owner login may not be.
          OWNER=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          PAGES="https://$OWNER.github.io/${{ github.event.repository.name }}"

          # Chrome reads the update URL from the policy for a force-installed
          # extension, but carrying it in the manifest too means a manually
          # installed copy also auto-updates.
          # `key` pins the extension id for a Load-unpacked install too, so
          # the id in the Admin console is the same one a BD sees whether
          # the copy came from the CRX or from the zip. Without it Chrome
          # invents a random id per unpacked folder.
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("extension/manifest.json", "utf8"));
            m.update_url = process.argv[1] + "/updates.xml";
            m.key = process.argv[2];
            fs.writeFileSync("extension/manifest.json", JSON.stringify(m, null, 2) + "\n");
          ' "$PAGES" "$(node tools/crx-id.js key.pem --der-base64)"

          # --pack-extension is a stable Chrome flag and produces a CRX3
          # signed with this key. The key fixes the extension id forever,
          # which is what the Admin console pins the install to.
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          test -n "$CHROME" || { echo "::error::No Chrome on the runner to pack the CRX."; exit 1; }
          "$CHROME" --pack-extension="$PWD/extension" --pack-extension-key="$PWD/key.pem" \
                    --no-message-box --no-sandbox
          rm -f key.pem

          mkdir -p dist
          mv extension.crx "dist/kylas-overlay.crx"

          cat > dist/updates.xml <<XML
          <?xml version='1.0' encoding='UTF-8'?>
          <gupdate xmlns='http://www.google.com/update2/response' protocol='2.0'>
            <app appid='$EXT_ID'>
              <updatecheck codebase='$PAGES/kylas-overlay.crx' version='${{ steps.version.outputs.version }}' />
            </app>
          </gupdate>
          XML

          # Rebuilt, not copied: this one carries update_url and key, so a
          # hand-installed copy has the same id and auto-updates too.
          (cd extension && zip -qr "../dist/kylas-overlay-${{ steps.version.outputs.version }}.zip" . -x '*.DS_Store')

          # The Chrome Web Store build is the one made BEFORE the key and
          # update_url were injected — the Store rejects a manifest carrying
          # either. Publishing it here gives a stable link that needs no
          # GitHub login, and the two names say which is which, because they
          # are interchangeable on sight and not at all in effect.
          cp "kylas-overlay-${{ steps.version.outputs.version }}.zip" \
             "dist/kylas-overlay-store-${{ steps.version.outputs.version }}.zip"

          # The Chrome Web Store requires a privacy policy URL before it
          # will accept a submission, even for a private, domain-only item.
          # Hosting it next to the extension means it is versioned with the
          # code that it describes, rather than living in someone's Docs.
          cat > dist/privacy.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Kylas Overlay — Privacy</title>
          <style>body{font:16px/1.65 system-ui;max-width:44rem;margin:3rem auto;padding:0 1rem;color:#222}
          h2{margin-top:2rem;font-size:1.15rem}code{background:#f3f4f6;padding:.15em .4em;border-radius:4px}</style>
          <h1>Kylas Overlay — Privacy</h1>
          <p><em>Last updated: \$(date -u +%d\ %B\ %Y). Applies to version ${{ steps.version.outputs.version }}.</em></p>
          <p>Kylas Overlay is an internal tool. It is published privately and can
             only be installed by members of our Google Workspace domain.</p>
          <h2>What it collects</h2>
          <p><strong>Nothing is collected by the developer.</strong> The extension
             has no analytics, no telemetry, and no server of its own. No data
             about you or your browsing is sent anywhere outside the systems
             listed below, all of which are operated by our own company.</p>
          <h2>What it stores on your machine</h2>
          <ul>
            <li>Your work email address, so the account list shows your accounts.</li>
            <li>Configuration supplied by your administrator (which Airtable base
                to read, and the address of our internal booking service).</li>
          </ul>
          <p>These are held in Chrome's own extension storage on your device.</p>
          <h2>What it talks to</h2>
          <ul>
            <li><code>app.kylas.io</code> — our CRM. The extension draws its panel
                on these pages; it reads the record you are looking at to know
                which account to show.</li>
            <li><code>api.airtable.com</code> — our own Airtable base, read-only,
                to display account information.</li>
            <li><code>script.google.com</code> — our own Google Apps Script service,
                to check calendar availability and create meetings you book.</li>
            <li><code>raw.githubusercontent.com</code> — a JSON configuration file
                that decides which fields the panel shows. Data only; no code is
                downloaded or executed.</li>
          </ul>
          <h2>Meetings you book</h2>
          <p>When you book a meeting, the invitation is created on your own Google
             Calendar and the attendees you chose are invited. Details of that
             meeting are written to our CRM, as they would be if you had entered
             them by hand.</p>
          <h2>Questions</h2>
          <p>Contact your administrator.</p>
          HTML

          # The Web Store's graphics have to be uploaded as files — there is
          # no URL field for them — and re-downloading them through chat or
          # email risks a client re-encoding the PNG, which is one way an
          # exactly-128x128 icon comes back "the wrong size". Serving them
          # from here means the bytes that arrive are the bytes that were
          # checked.
          cp -r store-assets dist/store

          # A page a BD can be pointed at, rather than a bare directory.
          cat > dist/index.html <<HTML
          <!doctype html><meta charset="utf-8"><title>Kylas Overlay</title>
          <style>body{font:16px/1.6 system-ui;max-width:44rem;margin:3rem auto;padding:0 1rem}
          code{background:#f3f4f6;padding:.15em .4em;border-radius:4px}</style>
          <h1>Kylas Overlay</h1>
          <p>Version <strong>${{ steps.version.outputs.version }}</strong></p>
          <p>Extension ID: <code>$EXT_ID</code></p>
          <p>If IT has rolled this out to you, it installs itself and updates itself —
             there is nothing to do here.</p>
          <h2>For admins: Web Store submission assets</h2>
          <ul>
            <li><a href="store/store-icon-128.png">store-icon-128.png</a> &mdash; Store icon
                (<a href="store/store-icon-128-no-alpha.png">flattened fallback</a>)</li>
            <li><a href="store/promo-440x280.png">promo-440x280.png</a> &mdash; small promo tile</li>
            <li><a href="store/promo-1400x560.png">promo-1400x560.png</a> &mdash; marquee tile</li>
            <li>Screenshots:
                <a href="store/shot1-company.png">1</a>,
                <a href="store/shot2-queue.png">2</a>,
                <a href="store/shot3-booking.png">3</a></li>
            <li><a href="store/listing.md">listing.md</a> &mdash; all the text, and the privacy answers</li>
          </ul>
          <h2>For admins: the Chrome Web Store build</h2>
          <p><a href="kylas-overlay-store-${{ steps.version.outputs.version }}.zip">kylas-overlay-store-${{ steps.version.outputs.version }}.zip</a>
             &mdash; upload this one to the Web Store. It has no <code>key</code>
             and no <code>update_url</code>, both of which the Store rejects.</p>
          <h2>Installing it by hand</h2>
          <p>Use the other zip for this &mdash; it carries the key that keeps the
             extension id stable across reloads.</p>
          <ol>
            <li><a href="kylas-overlay-${{ steps.version.outputs.version }}.zip">Download the zip</a> and unzip it.</li>
            <li>Open <code>chrome://extensions</code> and turn on <strong>Developer mode</strong>.</li>
            <li><strong>Load unpacked</strong>, and pick the unzipped folder.</li>
          </ol>
          <p>For admins: the update URL is <code>$PAGES/updates.xml</code>.</p>
          HTML

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Signed $EXT_ID version ${{ steps.version.outputs.version }}"

      # Everything in dist/ becomes a public URL with no login in front of
      # it, so this is the last point at which a credential can still be
      # stopped. The configured zip is built in this same job a few steps
      # up, one `rm` away from here — if that ordering is ever changed, or
      # a new step starts re-zipping extension/, this is what catches it
      # instead of a BD's token turning up on the open internet.
      - name: Refuse to publish anything carrying a credential
        if: steps.sign.outputs.signed == 'true'
        run: |
          test ! -e extension/config/secrets.js \
            || { echo "::error::extension/config/secrets.js still exists at publish time — everything zipped from extension/ after this point would carry it."; exit 1; }

          found=$(find dist -name 'kylas-overlay-configured-*' -print -quit)
          [ -z "$found" ] \
            || { echo "::error::The configured zip is in dist/ ($found). That directory is published to GitHub Pages with no login — it is meant to be an Actions artifact only."; exit 1; }

          # Belt and braces: unpack what is actually about to ship and look
          # for the file itself, whatever it ended up being called. These
          # are `if` blocks rather than `grep && { exit 1; }` because the
          # step runs under `bash -e`, where a trailing && list that ends in
          # a failed grep takes the whole step down — which would mean the
          # build fails precisely when the check PASSES.
          for z in dist/*.zip; do
            [ -e "$z" ] || continue
            if unzip -l "$z" | grep -q 'config/secrets\.js'; then
              echo "::error::$z contains config/secrets.js."
              exit 1
            fi
          done

          # A CRX is a header followed by the zip, so unzip reads it.
          if [ -e dist/kylas-overlay.crx ] \
             && unzip -l dist/kylas-overlay.crx 2>/dev/null | grep -q 'config/secrets\.js'; then
            echo "::error::the CRX contains config/secrets.js."
            exit 1
          fi

          echo "::notice::Nothing in dist/ carries a credential."

      - uses: actions/upload-pages-artifact@v3
        if: steps.sign.outputs.signed == 'true'
        with:
          path: dist

  # Separate job because deploy-pages needs its own environment.
  publish:
    needs: build
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
