# Reports what shape each secret has, without printing any of them.
#
# A secret that holds the wrong value looks identical to a correct one from
# the settings page — GitHub never shows it back to you. This says, for each
# of the three, how long it is and what it looks like, which is enough to
# spot a swap or a paste that didn't save.
#
# Actions -> Check secrets -> Run workflow.

name: Check secrets

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Describe each secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          APPS_SCRIPT_DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          node -e '
            // Shape only. Nothing here prints a secret or any part of one —
            // lengths and yes/no answers, which is all you need to tell
            // "wrong value" from "not set".
            const describe = (name, expected, test) => {
              const v = process.env[name] || "";
              if (!v) return console.log(name.padEnd(26) + "NOT SET");
              const verdict = test(v) ? "looks right" : "WRONG SHAPE — expected " + expected;
              console.log(name.padEnd(26) + String(v.trim().length).padStart(5) + " chars   " + verdict);
            };

            console.log("");
            describe("CLASPRC_JSON", "JSON with a refresh_token", (v) => {
              try {
                const c = JSON.parse(v.slice(v.indexOf("{"), v.lastIndexOf("}") + 1));
                return !!(c.tokens && c.tokens.default && c.tokens.default.refresh_token);
              } catch (e) { return false; }
            });
            describe("APPS_SCRIPT_ID", "a bare id, no braces", (v) => /^[A-Za-z0-9_-]{20,}$/.test(v.trim()));
            describe("APPS_SCRIPT_DEPLOYMENT_ID", "a bare id, usually AKfycb...", (v) => /^[A-Za-z0-9_-]{20,}$/.test(v.trim()));
            describe("ANTHROPIC_API_KEY", "sk-ant-...", (v) => v.trim().startsWith("sk-ant-"));
            describe("CRX_PRIVATE_KEY", "a PEM private key", (v) => v.includes("PRIVATE KEY"));
            console.log("");
            console.log("Optional ones showing NOT SET are fine — only the first three are needed for the import.");
          '
